name: Focused provider regression tests

on:
  pull_request:
    paths:
      - "agent/message_sanitization.py"
      - "agent/error_classifier.py"
      - "agent/turn_failure_copy.py"
      - "tests/agent/test_reasoning_replay_routes.py"
      - "tests/agent/test_error_classifier_content_policy.py"
      - "tests/agent/test_nvidia_endpoint_entitlement.py"
      - ".github/workflows/focused-provider-tests.yml"

permissions:
  contents: read

concurrency:
  group: focused-provider-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reasoning-and-policy:
    name: Reasoning replay and provider policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install test dependencies
        run: |
          uv sync --locked --python 3.14 --extra all --group dev --group test

      - name: Run focused regression tests
        run: |
          source .venv/bin/activate
          python -m pytest \
            tests/agent/test_reasoning_replay_routes.py \
            tests/agent/test_error_classifier_content_policy.py \
            tests/agent/test_nvidia_endpoint_entitlement.py \
            -q --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
