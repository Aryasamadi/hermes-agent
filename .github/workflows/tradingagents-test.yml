name: TradingAgents - Initial Analysis Test

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Symbol to analyze (example: NVDA, AAPL, MSFT)"
        required: true
        default: "NVDA"

      analysis_date:
        description: "Analysis date (YYYY-MM-DD). Leave empty for yesterday."
        required: false
        default: ""

      research_depth:
        description: "Research depth"
        required: true
        type: choice
        options:
          - 1
          - 2
          - 3
        default: 1

permissions:
  contents: read

jobs:
  tradingagents:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # ============================================================
      # LLM
      # ============================================================
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Optional:
      # If your provider is OpenAI-compatible, put its API endpoint
      # in the OPENAI_BASE_URL GitHub Secret.
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

      # TradingAgents provider
      TRADINGAGENTS_LLM_PROVIDER: openai

      # Set these to models available through your API.
      TRADINGAGENTS_DEEP_THINK_LLM: ${{ secrets.TRADINGAGENTS_DEEP_THINK_LLM }}
      TRADINGAGENTS_QUICK_THINK_LLM: ${{ secrets.TRADINGAGENTS_QUICK_THINK_LLM }}

      # ============================================================
      # TradingAgents configuration
      # ============================================================
      TRADINGAGENTS_OUTPUT_LANGUAGE: English
      TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
      TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
      TRADINGAGENTS_CHECKPOINT_ENABLED: "false"

      # ============================================================
      # Data
      # ============================================================
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # Use a clean location inside the runner.
      TRADINGAGENTS_RESULTS_DIR: ${{ github.workspace }}/tradingagents-results
      TRADINGAGENTS_CACHE_DIR: ${{ github.workspace }}/tradingagents-cache
      TRADINGAGENTS_MEMORY_LOG_PATH: ${{ github.workspace }}/tradingagents-results/memory.md

      PYTHONUNBUFFERED: "1"

    steps:

      # ------------------------------------------------------------
      # 1. Checkout this repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------------
      # 3. Verify required secrets
      # ------------------------------------------------------------
      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY is missing."
            echo "Add OPENAI_API_KEY to GitHub repository Secrets."
            exit 1
          fi

          if [[ -z "${TRADINGAGENTS_DEEP_THINK_LLM:-}" ]]; then
            echo "::error::TRADINGAGENTS_DEEP_THINK_LLM is missing."
            echo "Add the deep-thinking model name as a GitHub Secret."
            exit 1
          fi

          if [[ -z "${TRADINGAGENTS_QUICK_THINK_LLM:-}" ]]; then
            echo "::error::TRADINGAGENTS_QUICK_THINK_LLM is missing."
            echo "Add the quick-thinking model name as a GitHub Secret."
            exit 1
          fi

          echo "Configuration check passed."

      # ------------------------------------------------------------
      # 4. Clone the official TradingAgents repository
      # ------------------------------------------------------------
      - name: Download official TradingAgents
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/TauricResearch/TradingAgents.git \
            tradingagents-source

      # ------------------------------------------------------------
      # 5. Install TradingAgents exactly from its current source
      # ------------------------------------------------------------
      - name: Install TradingAgents
        shell: bash
        run: |
          set -euo pipefail

          cd tradingagents-source

          python -m pip install --upgrade pip

          pip install .

          echo
          echo "Installed TradingAgents:"
          python -c "import importlib.metadata; print(importlib.metadata.version('tradingagents'))"

      # ------------------------------------------------------------
      # 6. Prepare analysis date
      # ------------------------------------------------------------
      - name: Prepare analysis
        shell: bash
        env:
          INPUT_TICKER: ${{ inputs.ticker }}
          INPUT_DATE: ${{ inputs.analysis_date }}
          INPUT_DEPTH: ${{ inputs.research_depth }}
        run: |
          set -euo pipefail

          mkdir -p "$TRADINGAGENTS_RESULTS_DIR"
          mkdir -p "$TRADINGAGENTS_CACHE_DIR"

          if [[ -n "$INPUT_DATE" ]]; then
            ANALYSIS_DATE="$INPUT_DATE"
          else
            ANALYSIS_DATE="$(python - <<'PY'
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          yesterday = now.date() - timedelta(days=1)

          print(yesterday.isoformat())
          PY
          )"
          fi

          echo "ANALYSIS_TICKER=$INPUT_TICKER" >> "$GITHUB_ENV"
          echo "ANALYSIS_DATE=$ANALYSIS_DATE" >> "$GITHUB_ENV"
          echo "RESEARCH_DEPTH=$INPUT_DEPTH" >> "$GITHUB_ENV"

          echo "Ticker: $INPUT_TICKER"
          echo "Analysis date: $ANALYSIS_DATE"
          echo "Research depth: $INPUT_DEPTH"

      # ------------------------------------------------------------
      # 7. Run TradingAgents
      # ------------------------------------------------------------
      - name: Run TradingAgents analysis
        shell: bash
        run: |
          set -euo pipefail

          cd tradingagents-source

          cat > run_analysis.py <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          from tradingagents.default_config import DEFAULT_CONFIG
          from tradingagents.graph.trading_graph import TradingAgentsGraph


          def main():
              ticker = os.environ["ANALYSIS_TICKER"].strip().upper()
              analysis_date = os.environ["ANALYSIS_DATE"].strip()

              if not ticker:
                  raise ValueError("Ticker is empty.")

              if len(analysis_date) != 10:
                  raise ValueError(
                      f"Invalid analysis date: {analysis_date!r}. "
                      "Expected YYYY-MM-DD."
                  )

              print("=" * 80)
              print("TRADINGAGENTS INITIAL TEST")
              print("=" * 80)
              print(f"Ticker:         {ticker}")
              print(f"Analysis date:  {analysis_date}")
              print(
                  f"LLM provider:   "
                  f"{os.environ.get('TRADINGAGENTS_LLM_PROVIDER', 'openai')}"
              )
              print(
                  f"Deep model:     "
                  f"{os.environ.get('TRADINGAGENTS_DEEP_THINK_LLM')}"
              )
              print(
                  f"Quick model:    "
                  f"{os.environ.get('TRADINGAGENTS_QUICK_THINK_LLM')}"
              )
              print("=" * 80)
              print()

              config = DEFAULT_CONFIG.copy()

              # Never allow this first test to place real orders.
              # TradingAgents is being used only for analysis/decision output.
              config["checkpoint_enabled"] = False

              # Keep the first run relatively small and controlled.
              config["max_debate_rounds"] = int(
                  os.environ.get("TRADINGAGENTS_MAX_DEBATE_ROUNDS", "1")
              )

              config["max_risk_discuss_rounds"] = int(
                  os.environ.get("TRADINGAGENTS_MAX_RISK_ROUNDS", "1")
              )

              # Current default data vendors:
              # yfinance -> market/technical/fundamental/news
              # FRED      -> macro
              # Polymarket -> prediction markets
              #
              # We intentionally do not modify them in this first test.

              print("Initializing TradingAgents...")
              print()

              agent = TradingAgentsGraph(
                  debug=True,
                  config=config,
              )

              print("Starting analysis...")
              print()

              result, decision = agent.propagate(
                  ticker,
                  analysis_date,
              )

              timestamp = datetime.now(timezone.utc).isoformat()

              output = {
                  "test_timestamp_utc": timestamp,
                  "ticker": ticker,
                  "analysis_date": analysis_date,
                  "llm_provider": config.get("llm_provider"),
                  "deep_think_llm": config.get("deep_think_llm"),
                  "quick_think_llm": config.get("quick_think_llm"),
                  "decision": decision,
              }

              results_dir = os.environ.get(
                  "TRADINGAGENTS_RESULTS_DIR",
                  "../tradingagents-results",
              )

              os.makedirs(results_dir, exist_ok=True)

              json_path = os.path.join(
                  results_dir,
                  f"{ticker}_{analysis_date}_decision.json",
              )

              txt_path = os.path.join(
                  results_dir,
                  f"{ticker}_{analysis_date}_decision.txt",
              )

              with open(json_path, "w", encoding="utf-8") as f:
                  json.dump(
                      output,
                      f,
                      ensure_ascii=False,
                      indent=2,
                      default=str,
                  )

              with open(txt_path, "w", encoding="utf-8") as f:
                  f.write("=" * 80 + "\n")
                  f.write("TRADINGAGENTS DECISION\n")
                  f.write("=" * 80 + "\n\n")
                  f.write(f"Ticker: {ticker}\n")
                  f.write(f"Analysis date: {analysis_date}\n")
                  f.write(
                      f"LLM provider: {config.get('llm_provider')}\n"
                  )
                  f.write(
                      f"Deep model: {config.get('deep_think_llm')}\n"
                  )
                  f.write(
                      f"Quick model: {config.get('quick_think_llm')}\n\n"
                  )
                  f.write("-" * 80 + "\n")
                  f.write("FINAL DECISION\n")
                  f.write("-" * 80 + "\n\n")
                  f.write(str(decision))
                  f.write("\n")

              print()
              print("=" * 80)
              print("FINAL DECISION")
              print("=" * 80)
              print()
              print(decision)
              print()
              print("=" * 80)
              print(f"JSON saved to: {json_path}")
              print(f"TXT saved to:  {txt_path}")
              print("=" * 80)

          if __name__ == "__main__":
              try:
                  main()
              except KeyboardInterrupt:
                  print("\nInterrupted.", file=sys.stderr)
                  raise
              except Exception as exc:
                  print("\n" + "=" * 80, file=sys.stderr)
                  print("TRADINGAGENTS RUN FAILED", file=sys.stderr)
                  print("=" * 80, file=sys.stderr)
                  print(f"{type(exc).__name__}: {exc}", file=sys.stderr)
                  print("=" * 80, file=sys.stderr)
                  raise
          PY

          python run_analysis.py 2>&1 | tee "$TRADINGAGENTS_RESULTS_DIR/run.log"

      # ------------------------------------------------------------
      # 8. Save all results
      # ------------------------------------------------------------
      - name: Collect results
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TRADINGAGENTS_RESULTS_DIR"

          {
            echo "TradingAgents test"
            echo "=================="
            echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Ticker: ${ANALYSIS_TICKER:-unknown}"
            echo "Analysis date: ${ANALYSIS_DATE:-unknown}"
            echo
            echo "Python:"
            python --version
            echo
            echo "TradingAgents:"
            python -c "import importlib.metadata; print(importlib.metadata.version('tradingagents'))" || true
          } > "$TRADINGAGENTS_RESULTS_DIR/run-info.txt"

          echo
          echo "Result files:"
          find "$TRADINGAGENTS_RESULTS_DIR" -maxdepth 3 -type f -print || true

      # ------------------------------------------------------------
      # 9. Upload results as GitHub Artifact
      # ------------------------------------------------------------
      - name: Upload TradingAgents results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-analysis-${{ inputs.ticker }}
          path: |
            tradingagents-results/
            tradingagents-source/tradingagents-results/
          if-no-files-found: warn
          retention-days: 14
