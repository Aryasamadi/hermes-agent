name: Sync Hermes upstream

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/upstream-sync.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hermes-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fork with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fetch official upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main

      - name: Prepare upstream review snapshot
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/upstream-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git fetch upstream main
          git checkout -B "$branch" origin/main

          # This fork owns its GitHub Actions workflows. Compare and sync upstream
          # source while deliberately excluding .github/workflows to avoid needing
          # elevated workflow-file permissions for the default GITHUB_TOKEN.
          if git diff --quiet origin/main upstream/main -- . ':(exclude).github/workflows/**'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes outside GitHub Actions workflow files."
            exit 0
          fi

          if ! git merge --squash --no-commit upstream/main; then
            git reset --hard origin/main
            echo "::error::Upstream sync has conflicts. No branch was pushed; resolve conflicts manually."
            exit 1
          fi

          # Keep this fork's workflow definitions exactly as they are on main.
          # Remove upstream-added workflow files too; checkout alone would leave
          # untracked files (such as archive-inputs.yml) in the working tree.
          if [ -d .github/workflows ]; then
            find .github/workflows -type f -delete
          fi
          git checkout origin/main -- .github/workflows/
          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No effective changes after preserving fork-specific workflows."
            exit 0
          fi

          git commit -m "chore: propose upstream sync $(git rev-parse --short upstream/main)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push review branch
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin automation/upstream-sync

      - name: Open or update upstream review PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REPOSITORY_OWNER:automation/upstream-sync" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing upstream sync PR #$existing."
          else
            gh pr create               --repo "$GITHUB_REPOSITORY"               --base main               --head automation/upstream-sync               --title "chore: sync official Hermes upstream"               --body "Automated proposal to merge NousResearch/hermes-agent main into this fork. Review the diff and run the Telegram gateway checks before merging. This PR does not auto-merge."
          fi
