name: Hermes Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-agent-gateway
  cancel-in-progress: true

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      HERMES_HOME: /home/runner/.hermes
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      HERMES_BACKUP_KEY: ${{ secrets.HERMES_BACKUP_KEY }}

    steps:
      - name: Install supported Hermes runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HERMES_HOME"
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o /tmp/install-hermes.sh
          # Install the same fork/branch that supplied this workflow and its custom plugin.
          export HERMES_REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          bash /tmp/install-hermes.sh --channel main --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v hermes
          hermes --help >/dev/null
          installed_sha="$(git -C "$HERMES_HOME/hermes-agent" rev-parse HEAD)"
          if [ "$installed_sha" != "$GITHUB_SHA" ]; then
            echo "ERROR: installed source SHA $installed_sha does not match workflow SHA $GITHUB_SHA"
            exit 1
          fi
          echo "Installed Hermes source commit: $installed_sha"
          hermes --version
          echo "Hermes ${GITHUB_REPOSITORY} main installation completed."

      - name: Restore encrypted persistent state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HERMES_HOME" /tmp/hermes-restore /tmp/hermes-extract
          if [ -z "${HERMES_BACKUP_KEY:-}" ]; then
            echo 'ERROR: HERMES_BACKUP_KEY secret is missing.'
            exit 1
          fi

          if gh release view hermes-state --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            asset="$(gh release view hermes-state --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | startswith("hermes-state-") and endswith(".enc"))] | sort_by(.createdAt) | last | .name // empty')"
            if [ -z "$asset" ]; then
              echo 'ERROR: hermes-state release exists but has no encrypted backup; refusing to start without the saved model settings.'
              exit 1
            fi

            gh release download hermes-state --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/hermes-restore
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in "/tmp/hermes-restore/$asset" \
              -out /tmp/hermes-state.tar.gz \
              -pass env:HERMES_BACKUP_KEY

            /usr/bin/python3 - <<'PY'
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path("/tmp/hermes-state.tar.gz")
          with tarfile.open(archive, "r:gz") as bundle:
              for member in bundle.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"ERROR: Unsafe path in backup archive: {member.name}")
                  if not path.parts or path.parts[0] not in {"hermes", "manifest.json"}:
                      raise SystemExit(f"ERROR: Unexpected top-level backup entry: {member.name}")
          print("Backup archive paths validated.")
          PY

            tar -xzf /tmp/hermes-state.tar.gz --no-same-owner --no-same-permissions -C /tmp/hermes-extract
            root=''
            for candidate in /tmp/hermes-extract/hermes /tmp/hermes-extract/data; do
              if [ -d "$candidate" ]; then root="$candidate"; break; fi
            done
            if [ -z "$root" ]; then
              echo 'ERROR: Backup archive layout is not recognized; no state was restored.'
              exit 1
            fi

            # Restore durable user state, including clean-generation SQLite snapshots.
            # Never restore source checkouts, managed Python environments, caches, logs,
            # or live SQLite WAL/SHM/journal sidecars.
            rsync -a \
              --exclude='hermes-agent/' \
              --exclude='installs/' \
              --exclude='cache/' \
              --exclude='logs/' \
              --exclude='scratch/' \
              --exclude='*.db-wal' \
              --exclude='*.db-shm' \
              --exclude='*.db-journal' \
              --exclude='*.sqlite-wal' \
              --exclude='*.sqlite-shm' \
              --exclude='*.sqlite-journal' \
              --exclude='*.sqlite3-wal' \
              --exclude='*.sqlite3-shm' \
              --exclude='*.sqlite3-journal' \
              "$root/" "$HERMES_HOME/"

            rm -rf /tmp/hermes-restore /tmp/hermes-extract /tmp/hermes-state.tar.gz
            echo "Persistent Hermes state restored from $asset."
          else
            echo 'No existing backup release; preparing a first run.'
          fi

      - name: Apply safe persistent configuration
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          hermes config set sessions.auto_prune false
          hermes config set model.persist_switch_by_default true
          echo 'Persistent sessions and global-by-default model switching enabled.'

      - name: Install and enable custom model manager
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$HERMES_HOME/hermes-agent/plugins/custom-model-manager"
          target_dir="$HERMES_HOME/plugins/custom-model-manager"
          test -f "$source_dir/plugin.yaml"
          test -f "$source_dir/__init__.py"
          mkdir -p "$HERMES_HOME/plugins"
          rm -rf "$target_dir"
          cp -a "$source_dir" "$target_dir"
          export PATH="$HOME/.local/bin:$PATH"
          hermes plugins enable custom-model-manager
          echo 'Custom model manager is installed and enabled.'

      - name: Verify the actual Hermes runtime and dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HERMES_HOME/hermes-agent"

          runtime_python="$(PYTHONPATH="$HERMES_HOME/hermes-agent" /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from pm.environments import selected_venv
          venv = selected_venv(Path.cwd())
          candidate = venv / 'bin' / 'python'
          if not candidate.exists():
              candidate = venv / 'Scripts' / 'python.exe'
          print(candidate)
          PY
          )"
          if [ ! -x "$runtime_python" ]; then
            echo "ERROR: Hermes selected runtime Python was not found: $runtime_python"
            exit 1
          fi

          cat > /tmp/hermes-runtime-check.py <<'PY'
          import snowballstemmer
          import pydantic_core._pydantic_core
          import hermes_cli.main
          import httpx
          from hermes_cli.plugins import PluginContext
          from importlib.metadata import version
          assert callable(getattr(PluginContext, 'ask_text', None)), 'PluginContext.ask_text is unavailable'
          assert callable(getattr(PluginContext, 'ask_choice', None)), 'PluginContext.ask_choice is unavailable'
          print(f'snowballstemmer {version("snowballstemmer")}: OK')
          print(f'httpx {httpx.__version__}: OK')
          print('pydantic-core native extension: OK')
          print('Hermes CLI imports: OK')
          print('Interactive plugin prompts (ask_text/ask_choice): OK')
          PY
          "$runtime_python" /tmp/hermes-runtime-check.py

          "$runtime_python" -m py_compile "$HERMES_HOME/plugins/custom-model-manager/__init__.py"

          cat > /tmp/hermes-plugin-smoke.py <<'PY'
          from hermes_cli.plugins import discover_plugins, get_plugin_command_handler
          from hermes_cli.plugin_choices import bind_asker

          discover_plugins()
          handler = get_plugin_command_handler('addmodel')
          if not callable(handler):
              raise SystemExit('ERROR: custom-model-manager did not register /addmodel')

          text_answers = iter([
              'Hermes deployment smoke test',
              'https://example.invalid/v1',
              'SMOKE-TEST-NOT-A-REAL-KEY',
          ])

          def fake_asker(_question, choices):
              if choices is None:
                  return next(text_answers)
              return '❌ Reject'  # Never write a provider or touch config/.env in this smoke test.

          with bind_asker(fake_asker):
              result = handler('')
          if result != 'Request rejected. No provider was saved.':
              raise SystemExit(f'ERROR: /addmodel prompt smoke test failed: {result}')
          print('custom-model-manager: /addmodel registered; ask_text + ask_choice passed; no data written.')
          PY

          PYTHONPATH="$HERMES_HOME/hermes-agent" "$runtime_python" /tmp/hermes-plugin-smoke.py
          hermes --help >/dev/null
          echo 'Runtime verification passed.'

      - name: Validate restored SQLite state
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          home = Path(os.environ["HERMES_HOME"])
          excluded = {"hermes-agent", "installs", "cache", "logs", "scratch"}
          suffixes = (".db", ".sqlite", ".sqlite3")
          databases = []
          for path in sorted(home.rglob("*")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(home)
              if any(part in excluded for part in relative.parts):
                  continue
              if not path.name.lower().endswith(suffixes):
                  continue
              try:
                  uri = path.resolve().as_uri() + "?mode=ro"
                  with sqlite3.connect(uri, uri=True, timeout=30) as db:
                      result = db.execute("PRAGMA quick_check").fetchone()
                  if not result or result[0] != "ok":
                      raise RuntimeError(str(result[0] if result else "no result"))
              except Exception as exc:
                  raise SystemExit(f"ERROR: Restored SQLite database failed quick_check: {relative}: {exc}")
              databases.append(relative)
              print(f"SQLite state OK: {relative}")

          if not databases:
              print("No previous SQLite state found; first-run database creation is expected.")
          else:
              print(f"Validated {len(databases)} restored SQLite database(s); none were deleted.")
          PY

      - name: Start Hermes and maintain encrypted backups
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if [ -z "${HERMES_BACKUP_KEY:-}" ]; then
            echo 'ERROR: HERMES_BACKUP_KEY secret is missing.'
            exit 1
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo 'ERROR: TELEGRAM_BOT_TOKEN secret is missing.'
            exit 1
          fi
          if [ -z "${TELEGRAM_ALLOWED_USERS:-}" ]; then
            echo 'WARNING: TELEGRAM_ALLOWED_USER_ID is empty; verify access-control settings.'
          fi

          backup() {
            local work='/tmp/hermes-backup'
            local lock_file='/tmp/hermes-backup.lock'
            exec 9>"$lock_file"
            if ! flock -w 180 9; then
              echo 'ERROR: Timed out waiting for the previous Hermes backup to finish.'
              return 1
            fi

            rm -rf "$work"
            mkdir -p "$work/hermes"

            # Copy durable files while excluding generated runtime components and all
            # SQLite originals/sidecars. Databases are snapshotted separately below.
            rsync -a \
              --exclude='hermes-agent/' \
              --exclude='installs/' \
              --exclude='cache/' \
              --exclude='logs/' \
              --exclude='scratch/' \
              --exclude='*.db' \
              --exclude='*.sqlite' \
              --exclude='*.sqlite3' \
              --exclude='*.db-wal' \
              --exclude='*.db-shm' \
              --exclude='*.db-journal' \
              --exclude='*.sqlite-wal' \
              --exclude='*.sqlite-shm' \
              --exclude='*.sqlite-journal' \
              --exclude='*.sqlite3-wal' \
              --exclude='*.sqlite3-shm' \
              --exclude='*.sqlite3-journal' \
              "$HERMES_HOME/" "$work/hermes/"

            # Use SQLite's online backup API: it includes committed WAL content and
            # produces a standalone database file without copying live -wal/-shm files.
            /usr/bin/python3 - <<'PY'
          import json
          import os
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          home = Path(os.environ["HERMES_HOME"])
          output = Path("/tmp/hermes-backup/hermes")
          excluded = {"hermes-agent", "installs", "cache", "logs", "scratch"}
          suffixes = (".db", ".sqlite", ".sqlite3")
          database_files = []
          total_bytes = 0

          for source in sorted(home.rglob("*")):
              if not source.is_file() or source.is_symlink():
                  continue
              relative = source.relative_to(home)
              if any(part in excluded for part in relative.parts):
                  continue
              if not source.name.lower().endswith(suffixes):
                  continue

              target = output / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              try:
                  source_uri = source.resolve().as_uri() + "?mode=ro"
                  with sqlite3.connect(source_uri, uri=True, timeout=60) as src:
                      with sqlite3.connect(target, timeout=60) as dst:
                          src.backup(dst, pages=512, sleep=0.05)
                          result = dst.execute("PRAGMA quick_check").fetchone()
                          if not result or result[0] != "ok":
                              raise RuntimeError(str(result[0] if result else "no result"))
                  target.chmod(0o600)
              except Exception as exc:
                  target.unlink(missing_ok=True)
                  raise SystemExit(f"ERROR: Could not create a consistent SQLite snapshot for {relative}: {exc}")

              size = target.stat().st_size
              total_bytes += size
              database_files.append({"path": str(relative), "bytes": size})
              print(f"SQLite snapshot verified: {relative} ({size / (1024 * 1024):.1f} MiB)")

          if not (output / "config.yaml").is_file():
              raise SystemExit("ERROR: refusing to create a backup without Hermes config.yaml.")

          manifest = {
              "format_version": 1,
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "database_files": database_files,
              "database_bytes": total_bytes,
          }
          Path("/tmp/hermes-backup/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Snapshot set ready: {len(database_files)} SQLite DB(s), {total_bytes / (1024 * 1024):.1f} MiB.")
          PY

            # Low compression level favors predictable backup speed over CPU-heavy compression.
            tar -cf - -C "$work" hermes manifest.json | gzip -1 > "$work/hermes-state.tar.gz"
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in "$work/hermes-state.tar.gz" \
              -out "$work/hermes-state.enc" \
              -pass env:HERMES_BACKUP_KEY

            if ! gh release view hermes-state --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create hermes-state --repo "$GITHUB_REPOSITORY" \
                --title 'Hermes Persistent State (Encrypted)' \
                --notes 'Encrypted snapshots of durable Hermes state, including SQLite online-backup snapshots and model/provider settings. Source checkouts, Python environments, caches, logs and live SQLite sidecars are excluded. Latest two snapshots are retained.' \
                --latest=false
            fi

            local name="hermes-state-$(date -u +%Y%m%d-%H%M%S).enc"
            mv "$work/hermes-state.enc" "$work/$name"

            # Upload first so a failed upload never destroys the last known-good backup.
            gh release upload hermes-state "$work/$name" --repo "$GITHUB_REPOSITORY"

            # Retain two complete generations; the previous model-only asset naturally
            # ages out after two successful fresh-state snapshots.
            local old_assets failed=0
            old_assets="$(gh release view hermes-state --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | startswith("hermes-state-") and endswith(".enc"))] | sort_by(.createdAt) | reverse | .[2:] | .[].name')"
            while IFS= read -r old; do
              [ -n "$old" ] || continue
              gh release delete-asset hermes-state "$old" --repo "$GITHUB_REPOSITORY" --yes || failed=1
            done <<< "$old_assets"
            if [ "$failed" -ne 0 ]; then
              echo 'ERROR: At least one expired Hermes backup could not be removed.'
              return 1
            fi

            echo "Encrypted persistent-state backup uploaded: $name"
            rm -rf "$work"
          }

          # Start with the clean model-only baseline, then snapshot the new live state.
          backup
          (
            sleep 60
            while true; do
              backup || echo 'WARNING: Backup failed; it will retry in 5 minutes.'
              sleep 300
            done
          ) &
          BACKUP_PID=$!

          # End the gateway proactively before GitHub's 350-minute hard job timeout,
          # leaving time for graceful shutdown and the final encrypted snapshot.
          (
            sleep 320m
            kill -TERM "$$" 2>/dev/null || true
          ) &
          DEADLINE_PID=$!

          hermes gateway run &
          GATEWAY_PID=$!

          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            kill "$DEADLINE_PID" 2>/dev/null || true
            kill "$BACKUP_PID" 2>/dev/null || true
            wait "$BACKUP_PID" 2>/dev/null || true

            # Stop the gateway before taking the final SQLite snapshots.
            kill -TERM "$GATEWAY_PID" 2>/dev/null || true
            for _ in $(seq 1 90); do
              kill -0 "$GATEWAY_PID" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "$GATEWAY_PID" 2>/dev/null || true
            wait "$GATEWAY_PID" 2>/dev/null || true

            backup || echo 'WARNING: Final encrypted persistent-state backup failed.'
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          set +e
          wait "$GATEWAY_PID"
          gateway_status=$?
          set -e
          exit "$gateway_status"
          # Create the compact backup immediately before the gateway starts.
          backup
          (
            while true; do
              sleep 600
              backup || echo 'WARNING: Backup failed; it will retry in 10 minutes.'
            done
          ) &
          BACKUP_PID=$!
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            kill "$BACKUP_PID" 2>/dev/null || true
            wait "$BACKUP_PID" 2>/dev/null || true
            backup || echo 'WARNING: Final backup attempt failed.'
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          hermes gateway run
