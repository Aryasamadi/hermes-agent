name: Hermes Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      HERMES_HOME: /home/runner/.hermes
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      HERMES_BACKUP_KEY: ${{ secrets.HERMES_BACKUP_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hermes
        shell: bash
        run: |
          set -euo pipefail

          git clone https://github.com/NousResearch/hermes-agent.git /tmp/hermes
          cd /tmp/hermes
          pip install -e .

      - name: Restore Hermes state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$HERMES_HOME"
          mkdir -p /tmp/hermes-restore

          if [ -z "${HERMES_BACKUP_KEY:-}" ]; then
            echo "ERROR: HERMES_BACKUP_KEY is missing."
            exit 1
          fi

          if gh release view hermes-state --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ASSET="$(
              gh release view hermes-state \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets | map(select(.name | startswith("hermes-state-"))) | sort_by(.updatedAt) | last | .name'
            )"

            if [ -n "$ASSET" ] && [ "$ASSET" != "null" ]; then
              echo "Restoring Hermes backup: $ASSET"

              gh release download hermes-state \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$ASSET" \
                --dir /tmp/hermes-restore

              rm -rf /tmp/hermes-extract
              mkdir -p /tmp/hermes-extract

              openssl enc -d \
                -aes-256-cbc \
                -pbkdf2 \
                -in "/tmp/hermes-restore/$ASSET" \
                -out /tmp/hermes-state.tar.gz \
                -pass env:HERMES_BACKUP_KEY

              tar -xzf /tmp/hermes-state.tar.gz \
                -C /tmp/hermes-extract

              ROOT="/tmp/hermes-extract/hermes"

              # Compatibility with older backups that used data/ as root.
              if [ ! -d "$ROOT" ]; then
                ROOT="/tmp/hermes-extract/data"
              fi

              if [ ! -d "$ROOT" ]; then
                echo "ERROR: Invalid Hermes backup."
                exit 1
              fi

              cp -a "$ROOT/." "$HERMES_HOME/"
              echo "Hermes state restored from: $ROOT"
            else
              echo "No Hermes backup asset found."
            fi
          else
            echo "No Hermes state release exists yet."
          fi

      - name: Configure persistent sessions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HERMES_HOME"

          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          home = Path(os.environ["HERMES_HOME"])
          path = home / "config.yaml"

          if path.exists():
              try:
                  data = yaml.safe_load(path.read_text()) or {}
              except Exception:
                  data = {}
          else:
              data = {}

          if not isinstance(data, dict):
              data = {}

          sessions = data.setdefault("sessions", {})
          if not isinstance(sessions, dict):
              sessions = {}
              data["sessions"] = sessions

          sessions["auto_prune"] = False

          path.write_text(
              yaml.safe_dump(
                  data,
                  sort_keys=False,
                  allow_unicode=True,
              )
          )

          print("Persistent session configuration enabled.")
          PY

      - name: Install custom model manager
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="$HERMES_HOME/plugins/custom-model-manager"
          mkdir -p "$PLUGIN_DIR"

          cat > "$PLUGIN_DIR/plugin.yaml" <<'PLUGIN'
          name: custom-model-manager
          version: "1.0.0"
          description: Personal AI provider and model manager
          PLUGIN

          cat > "$PLUGIN_DIR/__init__.py" <<'PY'
          from __future__ import annotations

          import json
          import os
          import shlex
          from pathlib import Path

          import httpx

          HOME = Path(
              os.environ.get(
                  "HERMES_HOME",
                  str(Path.home() / ".hermes"),
              )
          )

          DATA_DIR = HOME / "plugin-data" / "custom-model-manager"
          DATA_FILE = DATA_DIR / "models.json"
          CONFIG_FILE = HOME / "config.yaml"
          ENV_FILE = HOME / ".env"

          def _ensure():
              DATA_DIR.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              if not DATA_FILE.exists():
                  DATA_FILE.write_text(
                      json.dumps(
                          {"models": {}},
                          indent=2,
                          ensure_ascii=False,
                      )
                  )

          def _load():
              _ensure()

              try:
                  data = json.loads(DATA_FILE.read_text())
              except Exception:
                  data = {"models": {}}

              if not isinstance(data, dict):
                  data = {"models": {}}

              data.setdefault("models", {})
              return data

          def _save(data):
              _ensure()

              tmp = DATA_FILE.with_suffix(".tmp")
              tmp.write_text(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False,
                  )
              )
              tmp.replace(DATA_FILE)

          def _load_config():
              import yaml

              if not CONFIG_FILE.exists():
                  return {}

              try:
                  value = yaml.safe_load(CONFIG_FILE.read_text())
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}

          def _save_config(data):
              import yaml

              tmp = CONFIG_FILE.with_suffix(".tmp")
              tmp.write_text(
                  yaml.safe_dump(
                      data,
                      sort_keys=False,
                      allow_unicode=True,
                  )
              )
              tmp.replace(CONFIG_FILE)

          def _slug(value):
              value = (
                  value.strip()
                  .lower()
                  .replace(" ", "-")
                  .replace("/", "-")
              )

              result = ""

              for char in value:
                  if char.isalnum() or char in "-_":
                      result += char

              if not result:
                  raise ValueError("Invalid provider name.")

              return result[:48]

          def _write_env(name, value):
              lines = []

              if ENV_FILE.exists():
                  lines = ENV_FILE.read_text().splitlines()

              prefix = name + "="

              lines = [
                  line
                  for line in lines
                  if not line.startswith(prefix)
              ]

              lines.append(f"{name}={value}")

              ENV_FILE.write_text(
                  "\n".join(lines) + "\n"
              )

              os.environ[name] = value

          def _add_provider(
              name,
              base_url,
              model,
              api_key,
          ):
              slug = _slug(name)

              env_name = (
                  "HERMES_CUSTOM_"
                  + slug.upper().replace("-", "_")
                  + "_API_KEY"
              )

              config = _load_config()

              providers = config.setdefault("providers", {})

              providers[slug] = {
                  "name": name,
                  "api": base_url.rstrip("/"),
                  "key_env": env_name,
                  "transport": "chat_completions",
                  "default_model": model,
                  "models": {
                      model: {},
                  },
              }

              _save_config(config)
              _write_env(env_name, api_key)

              data = _load()

              data["models"][slug] = {
                  "name": name,
                  "provider": f"custom:{slug}",
                  "base_url": base_url.rstrip("/"),
                  "model": model,
                  "key_env": env_name,
              }

              _save(data)
              return slug

          def _handle_add(raw_args):
              try:
                  args = shlex.split(raw_args)

                  if len(args) != 4:
                      return (
                          "Usage:\n"
                          '/addmodel "Provider Name" '
                          '"https://example.com/v1" '
                          '"model-name" "API_KEY"'
                      )

                  name, base_url, model, api_key = args

                  if not (
                      base_url.startswith("http://")
                      or base_url.startswith("https://")
                  ):
                      return "❌ Invalid API URL."

                  slug = _add_provider(
                      name,
                      base_url,
                      model,
                      api_key,
                  )

                  return (
                      "✅ Model added.\n\n"
                      f"Provider: {name}\n"
                      f"Model: {model}\n"
                      f"Provider ID: custom:{slug}\n\n"
                      "برای تست:\n"
                      f"/testmodel {slug}\n\n"
                      "برای استفاده:\n"
                      f"/model custom:{slug}:{model}"
                  )

              except Exception as exc:
                  return (
                      "❌ Failed to add model:\n"
                      f"{exc}"
                  )

          def _handle_list(raw_args):
              data = _load()
              models = data.get("models", {})

              if not models:
                  return (
                      "هیچ مدل شخصی ثبت نشده.\n\n"
                      "از /addmodel استفاده کن."
                  )

              config = _load_config()
              current = config.get("model", {})

              if not isinstance(current, dict):
                  current = {}

              current_provider = current.get("provider")
              current_model = current.get("default")

              lines = ["مدل‌های شخصی:\n"]

              for item in models.values():
                  active = ""

                  if (
                      current_provider == item["provider"]
                      and current_model == item["model"]
                  ):
                      active = " ⭐ فعال"

                  lines.append(
                      f"• {item['name']}{active}\n"
                      f" Provider: {item['provider']}\n"
                      f" Model: {item['model']}"
                  )

              return "\n".join(lines)

          async def _test_model(item):
              api = item["base_url"].rstrip("/")

              if not api.endswith("/v1"):
                  api += "/v1"

              endpoint = api + "/chat/completions"

              key = os.environ.get(
                  item["key_env"],
                  "",
              )

              if not key:
                  return "❌ API key is unavailable."

              headers = {
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
              }

              payload = {
                  "model": item["model"],
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply only with OK.",
                      }
                  ],
                  "max_tokens": 8,
              }

              try:
                  async with httpx.AsyncClient(
                      timeout=30
                  ) as client:
                      response = await client.post(
                          endpoint,
                          headers=headers,
                          json=payload,
                      )

                  if response.is_success:
                      return (
                          "✅ Model works.\n\n"
                          f"Provider: {item['name']}\n"
                          f"Model: {item['model']}\n"
                          f"HTTP: {response.status_code}"
                      )

                  return (
                      "❌ Model test failed.\n\n"
                      f"HTTP: {response.status_code}\n"
                      f"{response.text[:500]}"
                  )

              except Exception as exc:
                  return (
                      "❌ Connection failed.\n\n"
                      f"{exc}"
                  )

          async def _handle_test(raw_args):
              name = raw_args.strip()

              if not name:
                  return (
                      "Usage:\n"
                      "/testmodel PROVIDER"
                  )

              data = _load()

              item = data["models"].get(_slug(name))

              if item is None:
                  return (
                      f"❌ Provider '{name}' not found."
                  )

              return await _test_model(item)

          def register(ctx):
              ctx.register_command(
                  "addmodel",
                  _handle_add,
                  description="Add a personal AI model",
                  args_hint="<name> <url> <model> <api-key>",
              )

              ctx.register_command(
                  "mymodel",
                  _handle_list,
                  description="List personal AI models",
              )

              ctx.register_command(
                  "testmodel",
                  _handle_test,
                  description="Test a personal AI model",
                  args_hint="<provider>",
              )
          PY

          echo "Custom model manager installed."

      - name: Enable custom model manager
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp/hermes
          hermes plugins enable custom-model-manager || true

      - name: Validate Hermes
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            "$HERMES_HOME/plugins/custom-model-manager/__init__.py"

          if [ -f "$HERMES_HOME/state.db" ]; then
            python - <<'PY'
          import os
          import sqlite3

          path = os.path.join(
              os.environ["HERMES_HOME"],
              "state.db",
          )

          db = sqlite3.connect(
              f"file:{path}?mode=ro",
              uri=True,
          )

          result = db.execute(
              "PRAGMA integrity_check"
          ).fetchone()[0]

          db.close()

          if result != "ok":
              raise SystemExit(
                  "Existing state.db integrity check failed."
              )

          print("Existing state.db integrity check: OK.")
          PY
          fi

          echo "Hermes validation passed."

      - name: Start Hermes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          backup() {
            WORK="/tmp/hermes-backup"

            rm -rf "$WORK"
            mkdir -p "$WORK/hermes"

            # Copy regular Hermes state while excluding live SQLite files.
            rsync -a \
              --exclude='*.db' \
              --exclude='*.db-wal' \
              --exclude='*.db-shm' \
              --exclude='logs/' \
              --exclude='cache/' \
              "$HERMES_HOME/" \
              "$WORK/hermes/"

            # Snapshot every existing SQLite database consistently.
            python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          home = Path(os.environ["HERMES_HOME"])
          out = Path("/tmp/hermes-backup/hermes")

          found = False

          for source in home.rglob("*.db"):
              found = True

              relative = source.relative_to(home)
              target = out / relative

              target.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              try:
                  src = sqlite3.connect(
                      f"file:{source}?mode=ro",
                      uri=True,
                      timeout=30,
                  )

                  dst = sqlite3.connect(
                      target,
                      timeout=30,
                  )

                  try:
                      with dst:
                          src.backup(dst)
                  finally:
                      dst.close()
                      src.close()

                  print(f"Snapshot: {relative}")

              except sqlite3.Error as exc:
                  print(
                      f"WARNING: Could not snapshot "
                      f"{relative}: {exc}"
                  )

          if not found:
              print("No SQLite databases exist yet.")
          PY

            # state.db is optional during the first backup.
            if [ -f "$WORK/hermes/state.db" ]; then
              python - <<'PY'
          import sqlite3

          path = "/tmp/hermes-backup/hermes/state.db"

          with sqlite3.connect(path) as db:
              result = db.execute(
                  "PRAGMA integrity_check"
              ).fetchone()[0]

          if result != "ok":
              raise SystemExit(
                  "state.db integrity check failed"
              )

          print("state.db integrity check: OK")
          PY
            else
              echo "No state.db exists yet; continuing with a non-database backup."
            fi

            tar -czf \
              "$WORK/hermes-state.tar.gz" \
              -C "$WORK" \
              hermes

            openssl enc \
              -aes-256-cbc \
              -pbkdf2 \
              -salt \
              -in "$WORK/hermes-state.tar.gz" \
              -out "$WORK/hermes-state.enc" \
              -pass env:HERMES_BACKUP_KEY

            if ! gh release view hermes-state \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then

              gh release create hermes-state \
                --repo "$GITHUB_REPOSITORY" \
                --title "Hermes Persistent State" \
                --notes "Encrypted Hermes state backup." \
                --latest=false
            fi

            NAME="hermes-state-$(date +%Y%m%d-%H%M%S).enc"

            mv \
              "$WORK/hermes-state.enc" \
              "$WORK/$NAME"

            gh release upload \
              hermes-state \
              "$WORK/$NAME" \
              --repo "$GITHUB_REPOSITORY"

            echo "Backup completed: $NAME"

            rm -rf "$WORK"
          }

          if [ -z "${HERMES_BACKUP_KEY:-}" ]; then
            echo "ERROR: HERMES_BACKUP_KEY is missing."
            exit 1
          fi

          # The first backup may not contain state.db yet.
          backup

          # Keep a fresh encrypted snapshot every 10 minutes.
          (
            while true; do
              sleep 600
              backup || echo "WARNING: periodic backup failed."
            done
          ) &

          BACKUP_PID=$!

          cleanup() {
            kill "$BACKUP_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          cd /tmp/hermes
          hermes gateway run
