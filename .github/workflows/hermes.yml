name: Hermes Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hermes.yml

permissions:
  contents: write

concurrency:
  group: hermes-agent-gateway
  cancel-in-progress: true

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      HERMES_HOME: /home/runner/.hermes
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      HERMES_BACKUP_KEY: ${{ secrets.HERMES_BACKUP_KEY }}

    steps:
      - name: Install supported Hermes runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HERMES_HOME"
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o /tmp/install-hermes.sh
          # Install the same fork/branch that supplied this workflow and its custom plugin.
          export HERMES_REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          bash /tmp/install-hermes.sh --channel main --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v hermes
          hermes --help >/dev/null
          installed_sha="$(git -C "$HERMES_HOME/hermes-agent" rev-parse HEAD)"
          if [ "$installed_sha" != "$GITHUB_SHA" ]; then
            echo "ERROR: installed source SHA $installed_sha does not match workflow SHA $GITHUB_SHA"
            exit 1
          fi
          echo "Installed Hermes source commit: $installed_sha"
          hermes --version
          echo "Hermes ${GITHUB_REPOSITORY} main installation completed."

      - name: Restore encrypted persistent state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HERMES_HOME" /tmp/hermes-restore
          if [ -z "${HERMES_BACKUP_KEY:-}" ]; then
            echo 'ERROR: HERMES_BACKUP_KEY secret is missing.'
            exit 1
          fi

          if gh release view hermes-state --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            asset="$(gh release view hermes-state --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | startswith("hermes-state-") and endswith(".enc"))] | sort_by(.updatedAt) | last | .name // empty')"
            if [ -z "$asset" ]; then
              echo 'ERROR: hermes-state release exists but has no encrypted backup; refusing to start without checking persisted state.'
              exit 1
            fi

            gh release download hermes-state --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/hermes-restore
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in "/tmp/hermes-restore/$asset" \
              -out /tmp/hermes-state.tar.gz \
              -pass env:HERMES_BACKUP_KEY
            mkdir -p /tmp/hermes-extract
            tar -xzf /tmp/hermes-state.tar.gz -C /tmp/hermes-extract

            root=''
            for candidate in /tmp/hermes-extract/hermes /tmp/hermes-extract/data; do
              if [ -d "$candidate" ]; then root="$candidate"; break; fi
            done
            if [ -z "$root" ]; then
              echo 'ERROR: Backup archive layout is not recognized; no state was restored.'
              exit 1
            fi

            # Never restore generated source checkouts or the disposable runtime.
            rsync -a \
              --exclude='hermes-agent/' \
              --exclude='installs/' \
              "$root/" "$HERMES_HOME/"
            echo "Persistent state restored from $asset."
          else
            echo 'No existing backup release; preparing a first run.'
          fi

      - name: Apply safe persistent configuration
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          hermes config set sessions.auto_prune false
          hermes config set model.persist_switch_by_default true
          echo 'Persistent sessions and global-by-default model switching enabled.'

      - name: Install and enable custom model manager
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$HERMES_HOME/hermes-agent/plugins/custom-model-manager"
          target_dir="$HERMES_HOME/plugins/custom-model-manager"
          test -f "$source_dir/plugin.yaml"
          test -f "$source_dir/__init__.py"
          mkdir -p "$HERMES_HOME/plugins"
          rm -rf "$target_dir"
          cp -a "$source_dir" "$target_dir"
          export PATH="$HOME/.local/bin:$PATH"
          hermes plugins enable custom-model-manager
          echo 'Custom model manager is installed and enabled.'

      - name: Verify the actual Hermes runtime and dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HERMES_HOME/hermes-agent"

          runtime_python="$(PYTHONPATH="$HERMES_HOME/hermes-agent" /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from pm.environments import selected_venv
          venv = selected_venv(Path.cwd())
          candidate = venv / 'bin' / 'python'
          if not candidate.exists():
              candidate = venv / 'Scripts' / 'python.exe'
          print(candidate)
          PY
          )"
          if [ ! -x "$runtime_python" ]; then
            echo "ERROR: Hermes selected runtime Python was not found: $runtime_python"
            exit 1
          fi

          cat > /tmp/hermes-runtime-check.py <<'PY'
          import snowballstemmer
          import pydantic_core._pydantic_core
          import hermes_cli.main
          import httpx
          from hermes_cli.plugins import PluginContext
          from importlib.metadata import version
          assert callable(getattr(PluginContext, 'ask_text', None)), 'PluginContext.ask_text is unavailable'
          assert callable(getattr(PluginContext, 'ask_choice', None)), 'PluginContext.ask_choice is unavailable'
          print(f'snowballstemmer {version("snowballstemmer")}: OK')
          print(f'httpx {httpx.__version__}: OK')
          print('pydantic-core native extension: OK')
          print('Hermes CLI imports: OK')
          print('Interactive plugin prompts (ask_text/ask_choice): OK')
          PY
          "$runtime_python" /tmp/hermes-runtime-check.py

          "$runtime_python" -m py_compile "$HERMES_HOME/plugins/custom-model-manager/__init__.py"

          cat > /tmp/hermes-plugin-smoke.py <<'PY'
          from hermes_cli.plugins import discover_plugins, get_plugin_command_handler
          from hermes_cli.plugin_choices import bind_asker

          discover_plugins()
          handler = get_plugin_command_handler('addmodel')
          if not callable(handler):
              raise SystemExit('ERROR: custom-model-manager did not register /addmodel')

          text_answers = iter([
              'Hermes deployment smoke test',
              'https://example.invalid/v1',
              'SMOKE-TEST-NOT-A-REAL-KEY',
          ])

          def fake_asker(_question, choices):
              if choices is None:
                  return next(text_answers)
              return '❌ Reject'  # Never write a provider or touch config/.env in this smoke test.

          with bind_asker(fake_asker):
              result = handler('')
          if result != 'Request rejected. No provider was saved.':
              raise SystemExit(f'ERROR: /addmodel prompt smoke test failed: {result}')
          print('custom-model-manager: /addmodel registered; ask_text + ask_choice passed; no data written.')
          PY

          PYTHONPATH="$HERMES_HOME/hermes-agent" "$runtime_python" /tmp/hermes-plugin-smoke.py
          hermes --help >/dev/null
          echo 'Runtime verification passed.'

      - name: Validate persisted databases
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          home = Path(os.environ['HERMES_HOME'])
          databases = [p for p in home.rglob('*.db') if 'installs' not in p.parts and 'hermes-agent' not in p.parts]
          if not databases:
              print('No existing SQLite databases found; allowed on a first run.')
          for path in databases:
              with sqlite3.connect(f'file:{path}?mode=ro', uri=True, timeout=20) as db:
                  result = db.execute('PRAGMA integrity_check').fetchone()[0]
              if result != 'ok':
                  raise SystemExit(f'ERROR: SQLite integrity check failed: {path}: {result}')
              print(f'Database OK: {path.relative_to(home)}')
          PY

      - name: Start Hermes and maintain encrypted backups
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if [ -z "${HERMES_BACKUP_KEY:-}" ]; then
            echo 'ERROR: HERMES_BACKUP_KEY secret is missing.'
            exit 1
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo 'ERROR: TELEGRAM_BOT_TOKEN secret is missing.'
            exit 1
          fi
          if [ -z "${TELEGRAM_ALLOWED_USERS:-}" ]; then
            echo 'WARNING: TELEGRAM_ALLOWED_USER_ID is empty; verify access-control settings.'
          fi

          backup() {
            local work='/tmp/hermes-backup'
            rm -rf "$work"
            mkdir -p "$work/hermes"

            # Back up durable user state only; the Hermes source checkout
            # and PM-managed Python environments are recreated on every runner.
            rsync -a \
              --exclude='hermes-agent/' \
              --exclude='installs/' \
              --exclude='*.db' \
              --exclude='*.db-wal' \
              --exclude='*.db-shm' \
              --exclude='logs/' \
              --exclude='cache/' \
              "$HERMES_HOME/" "$work/hermes/"

            # Snapshot every SQLite DB using SQLite's online backup API.
            /usr/bin/python3 - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          home = Path(os.environ['HERMES_HOME'])
          output = Path('/tmp/hermes-backup/hermes')
          for source in home.rglob('*.db'):
              relative = source.relative_to(home)
              # The rsync above intentionally excludes cache/ and logs/. Do not
              # re-introduce their disposable SQLite files through this snapshot pass.
              # In particular, cache/scratch can contain thousands of temporary DBs.
              if any(part in {'installs', 'hermes-agent', 'cache', 'logs', 'scratch'}
                     for part in relative.parts):
                  continue
              target = output / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              try:
                  with sqlite3.connect(f'file:{source}?mode=ro', uri=True, timeout=30) as src:
                      with sqlite3.connect(target, timeout=30) as dst:
                          src.backup(dst)
                  print(f'SQLite snapshot saved: {relative}')
              except sqlite3.Error as exc:
                  raise SystemExit(f'ERROR: Could not snapshot {relative}: {exc}')
          PY

            /usr/bin/python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          root = Path('/tmp/hermes-backup/hermes')
          for path in root.rglob('*.db'):
              with sqlite3.connect(f'file:{path}?mode=ro', uri=True, timeout=20) as db:
                  result = db.execute('PRAGMA integrity_check').fetchone()[0]
              if result != 'ok':
                  raise SystemExit(f'ERROR: Backup DB integrity check failed: {path}: {result}')
          print('Backup database integrity checks passed.')
          PY

            tar -czf "$work/hermes-state.tar.gz" -C "$work" hermes
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in "$work/hermes-state.tar.gz" \
              -out "$work/hermes-state.enc" \
              -pass env:HERMES_BACKUP_KEY

            if ! gh release view hermes-state --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create hermes-state --repo "$GITHUB_REPOSITORY" \
                --title 'Hermes Persistent State' \
                --notes 'Encrypted Hermes state backup; recent verified backups are retained.' \
                --latest=false
            fi

            local name="hermes-state-$(date -u +%Y%m%d-%H%M%S).enc"
            mv "$work/hermes-state.enc" "$work/$name"

            # Make room BEFORE uploading. GitHub rejects uploads once a release
            # already has 1,000 assets, so post-upload cleanup alone is too late.
            local asset_count oldest_asset
            asset_count="$(gh release view hermes-state --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
            while [ "$asset_count" -ge 1000 ]; do
              oldest_asset="$(gh release view hermes-state --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | startswith("hermes-state-") and endswith(".enc"))] | sort_by(.createdAt) | .[0].name // empty')"
              if [ -z "$oldest_asset" ]; then
                echo "ERROR: Release has $asset_count assets and no old Hermes backup asset can safely be removed."
                return 1
              fi
              echo "Release asset limit reached; removing oldest backup before upload: $oldest_asset"
              gh release delete-asset hermes-state "$oldest_asset" --repo "$GITHUB_REPOSITORY" --yes
              asset_count="$(gh release view hermes-state --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
            done

            # Upload the new encrypted snapshot before routine retention cleanup.
            gh release upload hermes-state "$work/$name" --repo "$GITHUB_REPOSITORY"

            # Keep the 200 newest encrypted backups; preserve unrelated release assets.
            # Correct gh syntax is: gh release delete-asset <release-tag> <asset-name>.
            local old_assets
            old_assets="$(gh release view hermes-state --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | startswith("hermes-state-") and endswith(".enc"))] | sort_by(.createdAt) | reverse | .[200:] | .[].name')"
            while IFS= read -r old; do
              [ -n "$old" ] || continue
              gh release delete-asset hermes-state "$old" --repo "$GITHUB_REPOSITORY" --yes \
                || echo "WARNING: Could not delete old backup asset $old"
            done <<< "$old_assets"
            echo "Encrypted backup uploaded: $name"
            rm -rf "$work"
          }

          backup
          (
            while true; do
              sleep 600
              backup || echo 'WARNING: Backup failed; it will retry in 10 minutes.'
            done
          ) &
          BACKUP_PID=$!
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            kill "$BACKUP_PID" 2>/dev/null || true
            wait "$BACKUP_PID" 2>/dev/null || true
            backup || echo 'WARNING: Final backup attempt failed.'
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          hermes gateway run
