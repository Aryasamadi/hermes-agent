name: Hermes Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hermes
        run: |
          git clone https://github.com/NousResearch/hermes-agent.git /tmp/hermes
          cd /tmp/hermes
          pip install -e .

      - name: Run Hermes Gateway
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: |
          cd /tmp/hermes
          hermes gateway run
