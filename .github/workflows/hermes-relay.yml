name: Hermes AI Relay

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Request ID"
        required: true
        type: string
      prompt:
        description: "AI prompt"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate request
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail

          test -n "$REQUEST_ID"
          test -n "$PROMPT"

          echo "Relay request accepted."
          echo "Request ID: $REQUEST_ID"
          echo "Prompt received."

      - name: Call NVIDIA
        id: nvidia
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail

          RESPONSE_FILE="$RUNNER_TEMP/nvidia-response.json"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --max-time 60 \
            --request POST \
            "https://integrate.api.nvidia.com/v1/chat/completions" \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(python3 -c 'import json,os; print(json.dumps({
              "model":"openai/gpt-oss-20b",
              "messages":[{"role":"user","content":os.environ["PROMPT"]}],
              "max_tokens":1024,
              "stream":False
            }))')")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "NVIDIA request failed."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          python3 - "$RESPONSE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          choices = data.get("choices") or []
          if not choices:
              raise SystemExit("NVIDIA returned no choices.")

          message = choices[0].get("message") or {}
          content = message.get("content")

          if not content:
              raise SystemExit("NVIDIA returned empty content.")

          print(content)
          PY

      - name: Publish relay result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          RESULT: ${{ steps.nvidia.outcome }}
        run: |
          set -euo pipefail

          echo "Relay request ${REQUEST_ID}: ${RESULT}"

          if [ "${RESULT}" = "success" ]; then
            echo "AI request completed successfully."
          else
            echo "AI request failed."
          fi